<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统架构建模中心 (纯 RTDB 版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
          authDomain: "lfy-dashboard.firebaseapp.com",
          databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lfy-dashboard",
          storageBucket: "lfy-dashboard.firebasestorage.app",
          messagingSenderId: "765435998608",
          appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const dbRTDB = getDatabase(app);
        const ACCESS_PASSWORD = "888888"; 
        const UPLOAD_PASSWORD = "999999"; 
        
        window.systemConfig = { groups: [] };
        window.currentFactory = localStorage.getItem('selected_factory') || 'lfy';

        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth_cfg', 'true');
                document.getElementById('factory-select').value = window.currentFactory;
                loadConfig();
            } else {
                alert("密码错误！");
            }
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth_cfg') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('factory-select').value = window.currentFactory;
                loadConfig();
            }
            document.getElementById('pwd-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.checkPassword();
            });

            document.addEventListener('keydown', function(e) {
                if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
                const active = document.activeElement;
                if (!active || active.tagName !== 'INPUT' || !active.classList.contains('nav-input')) return;

                const inputs = Array.from(document.querySelectorAll('.nav-input'));
                const idx = inputs.indexOf(active);
                let target = null;

                if (e.key === 'ArrowRight' && active.selectionEnd === active.value.length) target = inputs[idx + 1];
                if (e.key === 'ArrowLeft' && active.selectionStart === 0) target = inputs[idx - 1];
                if (e.key === 'ArrowDown') target = inputs[idx + 2]; 
                if (e.key === 'ArrowUp') target = inputs[idx - 2];

                if(target) { target.focus(); e.preventDefault(); }
            });
        };

        window.switchFactory = function() {
            window.currentFactory = document.getElementById('factory-select').value;
            localStorage.setItem('selected_factory', window.currentFactory);
            document.getElementById('config-container').innerHTML = '<div style="padding:20px; text-align:center;">读取厂区设定中...</div>';
            loadConfig();
        }

        async function loadConfig() {
            const factoryName = window.currentFactory === 'lfy' ? 'LFY 厂' : 'LY 厂';
            document.getElementById('board-title').innerHTML = `⚙️ 架构建模中心 - <span style="color:#facc15;">${factoryName}</span>`;

            try {
                const layoutDocId = window.currentFactory === 'lfy' ? "layout" : "ly_layout";
                const snapshot = await get(ref(dbRTDB, 'system_config/' + layoutDocId));
                
                if (snapshot.exists()) {
                    window.systemConfig = snapshot.val();
                } else {
                    window.systemConfig = { groups: [] };
                }
                renderUI();
            } catch (e) {
                console.error(e);
                alert("读取设定失败：" + e.message);
            }
        }

        window.renderUI = function() {
            const container = document.getElementById('config-container');
            container.innerHTML = '';
            if(window.systemConfig.groups.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px; color:#94a3b8;">当前架构为空，请手动新增或通过 Excel 批量导入。</div>';
            }

            window.systemConfig.groups.forEach((group, gIndex) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-card';
                
                // ★ 加入了 ⬆️ 和 ⬇️ 按鈕
                let linesHtml = group.lines.map((line, lIndex) => `
                    <div class="line-item">
                        <button class="btn-icon" onclick="moveLineUp(${gIndex}, ${lIndex})" title="上移">⬆️</button>
                        <button class="btn-icon" onclick="moveLineDown(${gIndex}, ${lIndex})" title="下移">⬇️</button>
                        <input type="text" class="input-line-name nav-input" value="${line.name}" onchange="updateLine(${gIndex}, ${lIndex}, 'name', this.value)" placeholder="线别名称 (例: 针车C1)">
                        <input type="text" class="input-line-id nav-input" value="${line.id}" onchange="updateLine(${gIndex}, ${lIndex}, 'id', this.value)" placeholder="资料库ID (极重要)">
                        <button class="btn-del-line" onclick="removeLine(${gIndex}, ${lIndex})" title="删除">🗑️</button>
                    </div>
                `).join('');

                groupDiv.innerHTML = `
                    <div class="group-header">
                        <input type="text" class="input-group-name nav-input" value="${group.name}" onchange="updateGroup(${gIndex}, 'name', this.value)" placeholder="部门名称 (例: 针车A组)">
                        <div style="display:flex; align-items:center; gap: 15px;">
                            <label class="checkbox-label">
                                <input type="checkbox" ${group.isFactoryTotal ? 'checked' : ''} onchange="updateGroup(${gIndex}, 'isFactoryTotal', this.checked)">
                                计入全厂综合%
                            </label>
                            <button class="btn-del-group" onclick="removeGroup(${gIndex})">删除部门</button>
                        </div>
                    </div>
                    <div class="lines-container">
                        ${linesHtml}
                        <button class="btn-add-line" onclick="addLine(${gIndex})">+ 新增线别</button>
                    </div>
                `;
                container.appendChild(groupDiv);
            });
        }

        // ★ 新增的上下移動邏輯
        window.moveLineUp = (gIndex, lIndex) => {
            if (lIndex === 0) return;
            const lines = window.systemConfig.groups[gIndex].lines;
            [lines[lIndex], lines[lIndex - 1]] = [lines[lIndex - 1], lines[lIndex]];
            renderUI();
        }
        window.moveLineDown = (gIndex, lIndex) => {
            const lines = window.systemConfig.groups[gIndex].lines;
            if (lIndex === lines.length - 1) return;
            [lines[lIndex], lines[lIndex + 1]] = [lines[lIndex + 1], lines[lIndex]];
            renderUI();
        }

        window.updateGroup = (gIndex, field, value) => { window.systemConfig.groups[gIndex][field] = value; }
        window.updateLine = (gIndex, lIndex, field, value) => { window.systemConfig.groups[gIndex].lines[lIndex][field] = value; }
        window.addGroup = () => { window.systemConfig.groups.push({ name: "", isFactoryTotal: true, lines: [] }); renderUI(); }
        window.removeGroup = (gIndex) => { if(confirm("确定要删除此部门吗？")) { window.systemConfig.groups.splice(gIndex, 1); renderUI(); } }
        window.addLine = (gIndex) => { window.systemConfig.groups[gIndex].lines.push({ id: "", name: "" }); renderUI(); }
        window.removeLine = (gIndex, lIndex) => { window.systemConfig.groups[gIndex].lines.splice(lIndex, 1); renderUI(); }

        window.saveConfig = async function() {
            const btn = document.getElementById('save-btn');
            try {
                btn.innerText = "上传保存中...";
                for (let g of window.systemConfig.groups) {
                    if (!g.name) throw new Error("部门名称不能为空");
                    for (let l of g.lines) {
                        if (!l.name || !l.id) throw new Error("线别的名称与资料库ID均不能为空");
                    }
                }
                const layoutDocId = window.currentFactory === 'lfy' ? "layout" : "ly_layout";
                await set(ref(dbRTDB, 'system_config/' + layoutDocId), window.systemConfig);
                alert(`✅ ${window.currentFactory.toUpperCase()} 厂产线架构更新成功！`);
            } catch (e) {
                alert("❌ 保存失败：" + e.message);
            } finally {
                btn.innerText = "💾 保存架构设定至云端";
            }
        }

        window.handleConfigExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const pwd = prompt("⚠️ 高级权限操作！请输入批量导入密码以执行架构覆盖：");
            if (pwd !== UPLOAD_PASSWORD) {
                alert("密码错误，导入取消！");
                event.target.value = '';
                return;
            }

            const factoryUpper = window.currentFactory.toUpperCase();
            if (!confirm(`此操作将覆盖当前界面的【${factoryUpper} 厂】架构，确定执行？\n(确认后需点击下方保存才会真正写入云端)`)) {
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    document.getElementById('upload-config-label').innerText = "解析运算中...";
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

                    let groupsMap = new Map();
                    rows.forEach((row, idx) => {
                        if(idx === 0 && row[0] && String(row[0]).includes('部门')) return;
                        const gName = row[0];
                        const isTotalStr = row[1];
                        const lName = row[2];
                        const lId = row[3];
                        
                        if(!gName || !lName || !lId) return;

                        const isTotal = (isTotalStr === 'N' || isTotalStr === '否' || isTotalStr === false) ? false : true;

                        if(!groupsMap.has(gName)) {
                            groupsMap.set(gName, { name: gName, isFactoryTotal: isTotal, lines: [] });
                        }
                        groupsMap.get(gName).lines.push({ name: String(lName), id: String(lId) });
                    });

                    if (groupsMap.size === 0) throw new Error("未解析出有效架构，请检查 Excel 格式是否正确！");

                    window.systemConfig.groups = Array.from(groupsMap.values());
                    renderUI();
                    alert(`✅ Excel 架构解析成功！共识别出 ${groupsMap.size} 个部门。请检查无误后，点击底部「保存架构设定至云端」。`);

                } catch (err) {
                    alert("❌ 导入异常: " + err.message);
                } finally {
                    document.getElementById('upload-config-label').innerHTML = `<svg style="width:16px; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg> 批量导入 Excel 架构`;
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; margin: 0; padding: 20px; color: #94a3b8; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #161b22; padding: 40px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 300px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.1); }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 20px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 6px; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight:bold; }
        
        .container { max-width: 900px; margin: auto; background: #111827; padding: 30px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 10px;}
        h2 { color: #00e5ff; margin: 0; font-size: 22px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        
        .factory-select { background: #1e293b; color: #facc15; border: 1px solid #facc15; padding: 8px 15px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; outline: none; box-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }
        .factory-select option { background: #0f172a; color: #fff; }

        .top-controls { margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap;}
        .btn-cyan { background: #0891b2; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cyan:hover { background: #0ea5e9; }
        
        .upload-btn { background: #1e293b; color: #facc15; border: 1px dashed #facc15; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; display: flex; align-items: center;}
        .upload-btn:hover { background: #facc15; color: #0b0f19; box-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        input[type="file"] { display: none; }

        .btn-save { background: linear-gradient(90deg, #059669 0%, #10b981 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; flex-grow: 1; font-size: 16px;}
        .btn-save:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }

        .group-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; margin-bottom: 20px; padding: 15px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f172a; padding-bottom: 15px; margin-bottom: 15px; }
        .input-group-name { background: #0f172a; color: #00e5ff; border: 1px solid #00e5ff; font-size: 18px; padding: 8px; font-weight: bold; border-radius: 4px; width: 200px; outline:none; }
        
        .checkbox-label { color: #e2e8f0; font-weight: bold; cursor: pointer; }
        .btn-del-group { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .lines-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .line-item { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 5px; }
        .input-line-name { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; padding: 6px; width: 45%; border-radius: 4px; outline:none;}
        .input-line-id { background: #1e293b; color: #facc15; border: 1px solid #475569; padding: 6px; width: 45%; border-radius: 4px; outline:none; font-family: monospace;}
        .input-line-name:focus, .input-line-id:focus { border-color: #00e5ff; box-shadow: 0 0 5px rgba(0,229,255,0.3);}
        
        /* 排序按鈕樣式 */
        .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 14px; opacity: 0.6; padding: 0 2px; }
        .btn-icon:hover { opacity: 1; transform: scale(1.1); }
        .btn-del-line { background: transparent; border: none; cursor: pointer; font-size: 16px; opacity: 0.7; }
        .btn-del-line:hover { opacity: 1; }
        
        .btn-add-line { background: #334155; color: #e2e8f0; border: 1px dashed #64748b; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-add-line:hover { background: #475569; border-color: #94a3b8; }
        
        .info-box { background: rgba(0, 229, 255, 0.1); border-left: 4px solid #00e5ff; padding: 10px 15px; margin-bottom: 20px; font-size: 13px; line-height: 1.5; color: #cbd5e1; }
        .info-box span { color: #facc15; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="justify-content: center; margin-bottom:20px; font-size: 20px;">架构修改权限</h2>
            <input type="password" id="pwd-input" placeholder="请输入管理密码 (支持Enter)">
            <button onclick="checkPassword()">验证并进入</button>
        </div>
    </div>

    <div class="container">
        <div class="header-bar">
            <h2 id="board-title">⚙️ 系统架构建模中心</h2>
            <select id="factory-select" class="factory-select" onchange="switchFactory()">
                <option value="lfy">当前操作: LFY 厂架构</option>
                <option value="ly">当前操作: LY 厂架构</option>
            </select>
        </div>
        
        <div class="info-box">
            ⚠️ <b>极重要：</b> 右侧黄色字体的 <span>资料库ID</span> 决定了能否抓取到历史数据。若只是改名，ID <b>绝对不要改</b>。若是全新线别，请赋予新的英文/数字 ID。
            <br>✨ <b>快捷键提示：</b> 输入框支持使用键盘的 <b>上 下 左 右 键 (↑ ↓ ← →)</b> 快速切换光标。
        </div>

        <div class="top-controls">
            <button class="btn-cyan" onclick="addGroup()">+ 新增部门/群组</button>
            <label class="upload-btn" id="upload-config-label">
                <svg style="width:16px; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                批量导入 Excel 架构
                <input type="file" accept=".xlsx, .xls" onchange="handleConfigExcelUpload(event)">
            </label>
        </div>
        
        <div id="config-container"></div>
        
        <button id="save-btn" class="btn-save" style="width: 100%; margin-top:20px;" onclick="saveConfig()">💾 保存架构设定至云端</button>
    </div>
</body>
</html>
