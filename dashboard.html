<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业生产线多周综合看板</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
          authDomain: "lfy-dashboard.firebaseapp.com",
          databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lfy-dashboard",
          storageBucket: "lfy-dashboard.firebasestorage.app",
          messagingSenderId: "765435998608",
          appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ACCESS_PASSWORD = "888888"; 
        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth_dash', 'true');
            } else {
                alert("密码错误！");
            }
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth_dash') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
            }
        };

        const rowDefinitions = [
            { type: 'line', name: '裁断', id: 'cut', inFactory: true },
            { type: 'line', name: '准备', id: 'prep', inFactory: true },
            { type: 'line', name: '袜套', id: 'sock', inFactory: true },
            
            { type: 'header', name: '【针车A组】' },
            ...Array.from({length: 10}, (_, i) => ({ type: 'line', name: `针车A${i+1}`, id: `stitchA${i+1}`, inStitchA: true })),
            { type: 'line', name: '针车A-销样组', id: 'stitchA_sample', inStitchA: true },
            { type: 'summary', name: '针车A综合', calc: 'stitchA', inStitchTotal: true },

            { type: 'header', name: '【针车B组】' },
            ...Array.from({length: 14}, (_, i) => ({ type: 'line', name: `针车B${i+11}`, id: `stitchB${i+11}`, inStitchB: true })),
            { type: 'summary', name: '针车B综合', calc: 'stitchB', inStitchTotal: true },

            { type: 'summary', name: '针车总综合', calc: 'stitchTotal', inFactory: true },

            { type: 'header', name: '【成型组】' },
            ...['A','B','C','D','E','F'].map(c => ({ type: 'line', name: `成型${c}`, id: `mold${c}`, inMold: true })),
            { type: 'summary', name: '成型综合', calc: 'mold', inFactory: true },

            { type: 'summary', name: '🌟 全厂综合平均', calc: 'factory', isFactoryTotal: true },

            { type: 'header', name: '【其他辅助组 - 不计入全厂】' },
            { type: 'line', name: '拉帮组', id: 'pull', inFactory: false },
            ...Array.from({length: 5}, (_, i) => ({ type: 'line', name: `组底${i+1}`, id: `bottom${i+1}`, inFactory: false }))
        ];

        function getColorClass(val) {
            if (val === null || val === undefined || isNaN(val)) return '';
            if (val < 0.8) return 'bg-red';
            if (val >= 0.9 && val < 1.0) return 'bg-light-green';
            if (val >= 1.0) return 'bg-green';
            return '';
        }

        window.loadDashboard = async function() {
            const startDateStr = document.getElementById('start-date').value;
            const endDateStr = document.getElementById('end-date').value;
            if (!startDateStr || !endDateStr) return alert("请选择完整的起止日期范围！");

            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            if (start > end) return alert("开始日期不能大于结束日期！");

            const querySnapshot = await getDocs(collection(db, "production_data"));
            const dbData = {};
            querySnapshot.forEach(doc => {
                dbData[doc.id] = doc.data();
            });

            let weeks = [];
            let curr = new Date(start);
            let day = curr.getDay();
            let diff = curr.getDate() - day + (day === 0 ? -6 : 1);
            curr.setDate(diff);

            while (curr <= end) {
                let weekDays = [];
                let weekStartStr = '';
                let weekEndStr = '';
                for (let i = 0; i < 6; i++) {
                    let d = new Date(curr);
                    d.setDate(curr.getDate() + i);
                    let yyyy = d.getFullYear();
                    let mm = String(d.getMonth() + 1).padStart(2, '0');
                    let dd = String(d.getDate()).padStart(2, '0');
                    let dateStr = `${yyyy}-${mm}-${dd}`;
                    if (i === 0) weekStartStr = `${mm}/${dd}`;
                    if (i === 5) weekEndStr = `${mm}/${dd}`;
                    weekDays.push(dateStr);
                }
                weeks.push({
                    title: `${weekStartStr}-${weekEndStr}`,
                    days: weekDays
                });
                curr.setDate(curr.getDate() + 7);
            }

            if (weeks.length === 0) return alert("所选范围内没有找到周数据！");

            const theadTr1 = document.getElementById('thead-tr-1');
            const theadTr2 = document.getElementById('thead-tr-2');
            theadTr1.innerHTML = '<th rowspan="2" style="min-width:150px;">线别 / 部门</th>';
            theadTr2.innerHTML = '';

            weeks.forEach((week, wIdx) => {
                theadTr1.innerHTML += `<th colspan="7" class="week-group-header">第 ${wIdx+1} 周 (${week.title})</th>`;
                ['周一', '周二', '周三', '周四', '周五', '周六'].forEach(dName => {
                    theadTr2.innerHTML += `<th class="daily-col">${dName}</th>`;
                });
                theadTr2.innerHTML += `<th class="weekly-avg">整周综合</th>`;
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            rowDefinitions.forEach(rowDef => {
                const tr = document.createElement('tr');
                if (rowDef.type === 'header') {
                    tr.className = 'section-header-row';
                    let colSpan = 1 + weeks.length * 7;
                    tr.innerHTML = `<td colspan="${colSpan}" style="text-align:left; font-weight:bold; background:#e2e8f0; padding-left:15px;">${rowDef.name}</td>`;
                    tbody.appendChild(tr);
                    return;
                }

                if (rowDef.type === 'summary' || rowDef.isFactoryTotal) {
                    tr.className = 'summary-row';
                } else {
                    tr.className = 'data-row';
                }

                let html = `<td class="line-name">${rowDef.name}</td>`;

                weeks.forEach(week => {
                    let weekTotalProd = 0;
                    let weekTotalHours = 0;

                    week.days.forEach(dateStr => {
                        let dayData = dbData[dateStr] || {};
                        let valObj = getRowValueAndHours(rowDef, dayData);
                        if (valObj.hours > 0) {
                            html += `<td class="daily-col" style="background-color:${getColorClass(valObj.poh)};">${(valObj.poh * 100).toFixed(1)}%</td>`;
                            weekTotalProd += valObj.poh * valObj.hours;
                            weekTotalHours += valObj.hours;
                        } else {
                            html += `<td class="daily-col">-</td>`;
                        }
                    });

                    let weekAvgPoh = weekTotalHours > 0 ? (weekTotalProd / weekTotalHours) : NaN;
                    let avgStr = !isNaN(weekAvgPoh) ? `${(weekAvgPoh * 100).toFixed(1)}%` : '-';
                    html += `<td class="weekly-avg" style="background-color:${getColorClass(weekAvgPoh)};">${avgStr}</td>`;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function getRowValueAndHours(rowDef, dayData) {
            if (rowDef.type === 'line') {
                if (dayData[rowDef.id]) {
                    return { poh: dayData[rowDef.id].poh, hours: dayData[rowDef.id].hours };
                }
                return { poh: NaN, hours: 0 };
            }

            if (rowDef.calc === 'stitchA') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.inStitchA && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours;
                        h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }

            if (rowDef.calc === 'stitchB') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.inStitchB && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours;
                        h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }

            if (rowDef.calc === 'stitchTotal') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if ((rd.inStitchA || rd.inStitchB) && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours;
                        h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }

            if (rowDef.calc === 'mold') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.inMold && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours;
                        h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }

            if (rowDef.calc === 'factory' || rowDef.isFactoryTotal) {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.inFactory && rd.id && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours;
                        h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }

            return { poh: NaN, hours: 0 };
        }

        window.toggleDetails = function() {
            const cols = document.querySelectorAll('.daily-col');
            const isHidden = cols[0] && cols[0].style.display === 'none';
            cols.forEach(col => {
                col.style.display = isHidden ? 'table-cell' : 'none';
            });
        }
    </script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #2d3748; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a365d; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
        .login-box button { width: 100%; padding: 12px; background: #e53e3e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight:bold;}
        .login-box button:hover { background: #c53030; }

        .dashboard { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        .header-bar { border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #1a365d; margin: 0; text-align: center; }
        
        .controls { background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; justify-content: center; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input { padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; }
        .controls button { padding: 8px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; white-space: nowrap; }
        th, td { border: 1px solid #cbd5e0; padding: 6px 8px; text-align: center; }
        th { background-color: #1a365d; color: white; font-weight: 500; }
        .week-group-header { background-color: #2b6cb0 !important; color: white; }
        .weekly-avg { background-color: #feebc8; font-weight: bold; color: #744210; }
        .summary-row { background-color: #edf2f7; font-weight: bold; color: #1a365d; }
        .line-name { font-weight: 600; text-align: left; padding-left: 10px; background-color: #f7fafc; }

        .bg-red { background-color: #ffcccc !important; color: #900; }
        .bg-light-green { background-color: #cceeff !important; color: #036; }
        .bg-green { background-color: #99ff99 !important; color: #060; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="border:none; margin-bottom:10px; color:#1a365d;">系统登录</h2>
            <p style="color:#718096; font-size:14px; margin-bottom:20px;">高管综合看板端</p>
            <input type="password" id="pwd-input" placeholder="请输入管理密码">
            <button onclick="checkPassword()">进入看板</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="header-bar">
            <h2>📈 企业生产线多周综合看板</h2>
        </div>
        <div class="controls">
            <span>选择查询时间段：</span>
            <input type="date" id="start-date"> 至 <input type="date" id="end-date">
            <button onclick="loadDashboard()" style="background:#3182ce;">查询计算</button>
            <button onclick="toggleDetails()" style="background:#718096;">隐藏/展开 每日明细</button>
        </div>
        <div style="overflow-x: auto;">
            <table id="dashboard-table">
                <thead>
                    <tr id="thead-tr-1">
                        <th rowspan="2">线别 / 部门</th>
                    </tr>
                    <tr id="thead-tr-2">
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="10" style="text-align: center; color: #a0aec0; padding: 40px;">请选择起止日期并点击查询计算</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
