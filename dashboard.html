<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFY 綜合生產加權看板</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
            authDomain: "lfy-dashboard.firebaseapp.com",
            databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lfy-dashboard",
            storageBucket: "lfy-dashboard.firebasestorage.app",
            messagingSenderId: "765435998608",
            appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const allLines = [
            { id: "cut", name: "裁断", group: "裁断" },
            { id: "prep", name: "准备", group: "准备" },
            { id: "sock", name: "袜套", group: "袜套" },
            ...Array.from({length: 10}, (_, i) => ({ id: `stitchA${i+1}`, name: `针车A${i+1}`, group: "针车A" })),
            { id: "stitchA_sample", name: "针车A-销样组", group: "针车A" },
            ...Array.from({length: 14}, (_, i) => ({ id: `stitchB${i+11}`, name: `针车B${i+11}`, group: "针车B" })),
            ...['A','B','C','D','E','F'].map(c => ({ id: `mold${c}`, name: `成型${c}`, group: "成型" })),
            { id: "pull", name: "拉帮组", group: "拉帮组" },
            ...Array.from({length: 5}, (_, i) => ({ id: `bottom${i+1}`, name: `组底${i+1}`, group: "组底" }))
        ];

        const summaryGroups = {
            "裁断": ["cut"],
            "准备": ["prep"],
            "袜套": ["sock"],
            "针车A综合": allLines.filter(l => l.group === "针车A").map(l => l.id),
            "针车B综合": allLines.filter(l => l.group === "针车B").map(l => l.id),
            "针车总综合": allLines.filter(l => l.group === "针车A" || l.group === "针车B").map(l => l.id),
            "成型综合": allLines.filter(l => l.group === "成型").map(l => l.id),
            "组底综合": allLines.filter(l => l.group === "组底").map(l => l.id),
            "全厂综合": allLines.filter(l => ["裁断", "准备", "袜套", "针车A", "针车B", "成型"].includes(l.group)).map(l => l.id) // 不含拉幫、組底
        };

        window.onload = async () => {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.warn("匿名登入失敗，仍可嘗試讀取。");
            }
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dashboard-date').value = today;
            if(new Date().getDay() !== 0) {
                loadDashboard();
            }
        };

        window.getColor = function(val) {
            if (val === null || val === undefined || isNaN(val)) return '';
            if (val < 0.80) return 'color-red';          
            if (val >= 0.80 && val < 0.90) return '';    
            if (val >= 0.90 && val < 1.00) return 'color-light-green'; 
            if (val >= 1.00) return 'color-green';       
            return '';
        }

        window.formatPercent = function(val) {
            if (val === null || val === undefined || isNaN(val)) return '-';
            return (val * 100).toFixed(2) + '%';
        }

        window.toggleDetails = function() {
            const cols = document.querySelectorAll('.daily-col');
            const isHidden = cols[0].style.display === 'none';
            cols.forEach(col => {
                col.style.display = isHidden ? 'table-cell' : 'none';
            });
            document.getElementById('toggle-btn').innerText = isHidden ? "👁️ 隱藏每日明細" : "👁️ 展開每日明細";
        }

        function getWeekDates(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay() || 7; 
            d.setDate(d.getDate() - day + 1); 
            
            const dates = [];
            for (let i = 0; i < 6; i++) { 
                const tempDate = new Date(d);
                tempDate.setDate(d.getDate() + i);
                dates.push(tempDate.toISOString().split('T')[0]);
            }
            return dates;
        }

        window.loadDashboard = async function() {
            if (!auth.currentUser) await signInAnonymously(auth);
            
            const dateStr = document.getElementById('dashboard-date').value;
            if (!dateStr) return alert("請選擇日期！");

            const dates = getWeekDates(dateStr);
            document.getElementById('week-range').innerText = `(${dates[0]} 至 ${dates[5]})`;

            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '<tr><td colspan="8" style="padding: 20px;">資料載入與計算中，請稍候...</td></tr>';

            const dataByDate = {};
            try {
                const docRefs = dates.map(date => getDoc(doc(db, "production_data", date)));
                const snaps = await Promise.all(docRefs);
                snaps.forEach((snap, idx) => {
                    if (snap.exists()) {
                        dataByDate[dates[idx]] = snap.data();
                    } else {
                        dataByDate[dates[idx]] = {};
                    }
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="8" style="color:red;">資料讀取失敗，請確認網路連線。</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            
            // 獨立的線別與綜合分組統一在此渲染
            const renderGroups = [...allLines, ...Object.keys(summaryGroups).map(k => ({id: k, name: k, isSummary: true}))];
            
            // 將欲顯示的順序整理好
            const displayList = [];
            // 裁斷
            displayList.push(allLines.find(l=>l.id==='cut'));
            // 準備
            displayList.push(allLines.find(l=>l.id==='prep'));
            // 襪套
            displayList.push(allLines.find(l=>l.id==='sock'));
            
            // 針車A
            allLines.filter(l=>l.group==='针车A').forEach(l=>displayList.push(l));
            displayList.push({id: '针车A综合', name: '針車A 綜合', isSummary: true, style: 'font-weight:bold; background-color:#e8f4f8;'});
            
            // 針車B
            allLines.filter(l=>l.group==='针车B').forEach(l=>displayList.push(l));
            displayList.push({id: '针车B综合', name: '針車B 綜合', isSummary: true, style: 'font-weight:bold; background-color:#e8f4f8;'});
            
            displayList.push({id: '针车总综合', name: '針車 總綜合', isSummary: true, style: 'font-weight:bold; background-color:#d4e6f1; color:#2980b9;'});
            
            // 成型
            allLines.filter(l=>l.group==='成型').forEach(l=>displayList.push(l));
            displayList.push({id: '成型综合', name: '成型 綜合', isSummary: true, style: 'font-weight:bold; background-color:#e8f4f8;'});
            
            // 拉幫
            displayList.push(allLines.find(l=>l.id==='pull'));
            
            // 組底
            allLines.filter(l=>l.group==='组底').forEach(l=>displayList.push(l));
            displayList.push({id: '组底综合', name: '組底 綜合', isSummary: true, style: 'font-weight:bold; background-color:#e8f4f8;'});
            
            // 全廠
            displayList.push({id: '全厂综合', name: '🏭 全廠綜合 (加權)', isSummary: true, style: 'font-weight:bold; font-size:18px; background-color:#2c3e50; color:white;'});

            // 開始渲染表格
            displayList.forEach(item => {
                if(!item) return;
                
                const tr = document.createElement('tr');
                if(item.style) tr.style = item.style;
                
                let html = `<td class="line-name">${item.name}</td>`;
                
                let weeklyTotalHours = 0;
                let weeklyWeightedPoh = 0;
                
                // 決定要計算的 ID 陣列
                const targetIds = item.isSummary ? summaryGroups[item.id] : [item.id];

                // 每日計算
                dates.forEach(date => {
                    let dailyTotalHours = 0;
                    let dailyWeightedPoh = 0;

                    targetIds.forEach(tid => {
                        const cellData = dataByDate[date][tid];
                        if (cellData && cellData.hours > 0) {
                            dailyTotalHours += cellData.hours;
                            dailyWeightedPoh += cellData.poh * cellData.hours; // 權重 = 達成率 * 工時
                        }
                    });

                    if (dailyTotalHours > 0) {
                        const dailyAvg = dailyWeightedPoh / dailyTotalHours;
                        const colorClass = item.id === '全厂综合' ? '' : window.getColor(dailyAvg); // 全廠綜合強制為深色底，不變色
                        
                        html += `<td class="daily-col ${colorClass}">${window.formatPercent(dailyAvg)}</td>`;
                        
                        weeklyTotalHours += dailyTotalHours;
                        weeklyWeightedPoh += dailyWeightedPoh;
                    } else {
                        html += `<td class="daily-col">-</td>`;
                    }
                });

                // 全週計算
                if (weeklyTotalHours > 0) {
                    const weeklyAvg = weeklyWeightedPoh / weeklyTotalHours;
                    const colorClass = item.id === '全厂综合' ? '' : window.getColor(weeklyAvg);
                    html += `<td class="weekly-avg ${colorClass}">${window.formatPercent(weeklyAvg)}</td>`;
                } else {
                    html += `<td class="weekly-avg">-</td>`;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-size: 26px;}
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #ecf0f1; padding: 15px 20px; border-radius: 8px; }
        .controls input[type="date"] { padding: 10px; font-size: 16px; border: 1px solid #bdc3c7; border-radius: 4px; margin: 0 10px; font-family: inherit;}
        .btn-action { padding: 10px 20px; background-color: #3498db; color: white; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-action:hover { background-color: #2980b9; }
        .btn-toggle { background-color: #e67e22; }
        .btn-toggle:hover { background-color: #d35400; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border: 1px solid #ddd; font-size: 15px;}
        th { background-color: #2c3e50; color: white; font-size: 16px; position: sticky; top: 0; z-index: 10;}
        
        tbody tr:hover { background-color: #f5f5f5; }
        .line-name { font-weight: 500; text-align: left; padding-left: 20px; }
        .weekly-avg { font-weight: bold; border-left: 3px solid #2c3e50; font-size: 16px; }
        
        /* 顏色判定 */
        .color-red { background-color: #ffcccc !important; color: #c0392b !important; font-weight: bold; }
        .color-light-green { background-color: #d5f5e3 !important; color: #27ae60 !important; font-weight: bold; }
        .color-green { background-color: #2ecc71 !important; color: white !important; font-weight: bold; }
        
        /* 圖例 */
        .legend { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 14px;}
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .box { width: 20px; height: 20px; border: 1px solid #ccc; border-radius: 3px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 LFY 綜合生產看板 <span id="week-range" style="font-size:20px; color:#7f8c8d; font-weight:normal;"></span></h2>
        
        <div class="legend">
            <div class="legend-item"><div class="box color-red"></div> &lt; 80%</div>
            <div class="legend-item"><div class="box" style="background:#fff"></div> 80% ~ &lt; 90%</div>
            <div class="legend-item"><div class="box color-light-green"></div> 90% ~ &lt; 100%</div>
            <div class="legend-item"><div class="box color-green"></div> &ge; 100%</div>
        </div>

        <div class="controls">
            <div>
                <label style="font-weight: bold;">選擇該週任意一天：</label>
                <input type="date" id="dashboard-date">
                <button class="btn-action" onclick="loadDashboard()">🔍 查詢整週資料</button>
            </div>
            <button class="btn-action btn-toggle" id="toggle-btn" onclick="toggleDetails()">👁️ 隱藏每日明細</button>
        </div>
        
        <table id="dashboard-table">
            <thead>
                <tr>
                    <th width="20%">部門 / 綜合組別</th>
                    <th class="daily-col" width="11%">週一</th>
                    <th class="daily-col" width="11%">週二</th>
                    <th class="daily-col" width="11%">週三</th>
                    <th class="daily-col" width="11%">週四</th>
                    <th class="daily-col" width="11%">週五</th>
                    <th class="daily-col" width="11%">週六</th>
                    <th class="weekly-avg" width="14%">整週綜合(加權)</th>
                </tr>
            </thead>
            <tbody id="dashboard-table-body">
                <!-- Javascript 動態生成數據 -->
            </tbody>
        </table>
    </div>
</body>
</html>
