<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业生产线综合看板</title>
    <!-- 引入 Excel 解析库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 请替换为您真实的 Firebase Config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 登录密码检查
        const ACCESS_PASSWORD = "888888"; 
        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth_dash', 'true');
                signInAnonymously(auth);
            } else {
                alert("密码错误！");
            }
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth_dash') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                signInAnonymously(auth);
            }
        };

        // 处理 Excel 历史数据导入
        window.handleExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!confirm("即将解析并导入该 Excel 中的所有数据，这可能需要几秒钟，确定执行？")) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    document.getElementById('upload-btn-label').innerText = "数据处理中...";
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    
                    const sheetPoh = workbook.Sheets["POH输入"];
                    const sheetHours = workbook.Sheets["工时输入"];
                    if (!sheetPoh || !sheetHours) throw new Error("找不到名为 'POH输入' 或 '工时输入' 的工作表");

                    const jsonPoh = XLSX.utils.sheet_to_json(sheetPoh, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});
                    const jsonHours = XLSX.utils.sheet_to_json(sheetHours, {header: 1});
                    
                    const dates = jsonPoh[0]; // 第一列是日期
                    const firebaseData = {};
                    
                    for(let i = 1; i < jsonPoh.length; i++) {
                        const lineName = jsonPoh[i][0];
                        if(!lineName) continue;
                        
                        for(let j = 1; j < dates.length; j++) {
                            const dateStr = dates[j];
                            const poh = parseFloat(jsonPoh[i][j]);
                            const hours = parseFloat(jsonHours[i][j]);
                            
                            if(!isNaN(poh) && !isNaN(hours) && dateStr) {
                                // 格式化日期为 YYYY-MM-DD
                                let finalDate = String(dateStr).split(' ')[0];
                                // 如果是从 Excel 读出的特殊格式，进行修复
                                if (finalDate.includes('/')) finalDate = finalDate.replace(/\//g, '-');
                                
                                if(!firebaseData[finalDate]) firebaseData[finalDate] = {};
                                firebaseData[finalDate][lineName] = { poh, hours };
                            }
                        }
                    }
                    
                    // 写入 Firebase
                    let count = Object.keys(firebaseData).length;
                    for(const [date, payload] of Object.entries(firebaseData)) {
                        await setDoc(doc(db, "production_data", date), payload);
                    }
                    alert(`✅ 成功导入 ${count} 天的历史数据！`);
                    document.getElementById('upload-btn-label').innerText = "📁 导入历史 Excel";
                } catch (err) {
                    alert("❌ 导入失败: " + err.message);
                    document.getElementById('upload-btn-label').innerText = "📁 导入历史 Excel";
                }
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #2d3748; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a365d; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
        .login-box button { width: 100%; padding: 12px; background: #e53e3e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight:bold;}
        .login-box button:hover { background: #c53030; }

        .dashboard { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #1a365d; margin: 0; }
        
        .upload-btn { background: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .upload-btn:hover { background: #e2e8f0; }
        input[type="file"] { display: none; }

        /* 报表区域预留位置（待加权平均逻辑填入） */
        .controls { background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; gap: 15px; align-items: center; }
        .controls input { padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="border:none; margin-bottom:10px; color:#1a365d;">系统登录</h2>
            <p style="color:#718096; font-size:14px; margin-bottom:20px;">高管综合看板端</p>
            <input type="password" id="pwd-input" placeholder="请输入管理密码">
            <button onclick="checkPassword()">进入看板</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="header-bar">
            <h2>📈 企业生产线综合看板</h2>
            <label class="upload-btn" id="upload-btn-label">
                📁 导入历史 Excel
                <input type="file" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
            </label>
        </div>
        <div class="controls">
            <span>选择周别范围：</span>
            <input type="date" id="start-date"> 至 <input type="date" id="end-date">
            <button style="padding:8px 15px; background:#3182ce; color:white; border:none; border-radius:4px; cursor:pointer;">查询计算</button>
            <button style="padding:8px 15px; background:#718096; color:white; border:none; border-radius:4px; cursor:pointer;">隐藏每日明细</button>
        </div>
        <!-- 下方表格預留空間 -->
        <div style="margin-top: 40px; text-align: center; color: #a0aec0; padding: 50px; border: 2px dashed #e2e8f0; border-radius: 8px;">
            请先从右上方导入历史 Excel 建立数据库！<br>
            （加权平均数据渲染模块已就绪）
        </div>
    </div>
</body>
</html>
