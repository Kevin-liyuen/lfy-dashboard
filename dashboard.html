<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业生产线综合看板</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 请替换为您真实的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
            authDomain: "lfy-dashboard.firebaseapp.com",
            databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lfy-dashboard",
            storageBucket: "lfy-dashboard.firebasestorage.app",
            messagingSenderId: "765435998608",
            appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 登录密码检查
        const ACCESS_PASSWORD = "888888"; 
        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth_dash', 'true');
            } else {
                alert("密码错误！");
            }
        };

        // 线别设定
        const allLines = [
            { id: "cut", name: "裁断", group: "裁断" },
            { id: "prep", name: "准备", group: "准备" },
            { id: "sock", name: "袜套", group: "袜套" },
            ...Array.from({length: 10}, (_, i) => ({ id: `stitchA${i+1}`, name: `针车A${i+1}`, group: "针车A" })),
            { id: "stitchA_sample", name: "针车A-销样组", group: "针车A" },
            ...Array.from({length: 14}, (_, i) => ({ id: `stitchB${i+11}`, name: `针车B${i+11}`, group: "针车B" })),
            ...['A','B','C','D','E','F'].map(c => ({ id: `mold${c}`, name: `成型${c}`, group: "成型" })),
            { id: "pull", name: "拉帮组", group: "拉帮组" },
            ...Array.from({length: 5}, (_, i) => ({ id: `bottom${i+1}`, name: `组底${i+1}`, group: "组底" }))
        ];

        // 综合看板需要计算的类别与对应的子线别 ID
        const summaryGroups = {
            "裁断": ["cut"],
            "准备": ["prep"],
            "袜套": ["sock"],
            "针车A综合": allLines.filter(l => l.group === "针车A").map(l => l.id),
            "针车B综合": allLines.filter(l => l.group === "针车B").map(l => l.id),
            "针车总综合": allLines.filter(l => l.group === "针车A" || l.group === "针车B").map(l => l.id),
            "成型综合": allLines.filter(l => l.group === "成型").map(l => l.id),
            "拉帮组": ["pull"],
            "组底综合": allLines.filter(l => l.group === "组底").map(l => l.id),
            "全厂综合": allLines.filter(l => ["裁断", "准备", "袜套", "针车A", "针车B", "成型"].includes(l.group)).map(l => l.id) // 不含拉帮、组底
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth_dash') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
            }
            
            // 预设选择本周一
            const today = new Date();
            const day = today.getDay() || 7; 
            today.setDate(today.getDate() - day + 1);
            document.getElementById('dashboard-date').value = today.toISOString().split('T')[0];
        };

        window.getColor = function(val) {
            if (val === null || val === undefined || isNaN(val)) return '';
            if (val < 0.80) return 'color-red';          // < 80% 红色
            if (val >= 0.80 && val < 0.90) return '';    // 80%~90% 无色
            if (val >= 0.90 && val < 1.00) return 'color-light-green'; // 90%~100% 浅绿
            if (val >= 1.00) return 'color-green';       // >= 100% 绿色
            return '';
        }

        window.formatPercent = function(val) {
            if (val === null || val === undefined || isNaN(val)) return '-';
            return (val * 100).toFixed(2) + '%';
        }

        window.toggleDetails = function() {
            const cols = document.querySelectorAll('.daily-col');
            const btn = document.getElementById('toggle-btn');
            const isHidden = cols[0].style.display === 'none';
            cols.forEach(col => {
                col.style.display = isHidden ? 'table-cell' : 'none';
            });
            btn.innerText = isHidden ? "👁️ 隐藏每日明细" : "👁️ 展开每日明细";
        }

        function getWeekDates(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay() || 7; // 将周日(0)转为7
            d.setDate(d.getDate() - day + 1); // 退回周一
            
            const dates = [];
            for (let i = 0; i < 6; i++) { // 周一至周六 (6天)
                const tempDate = new Date(d);
                tempDate.setDate(d.getDate() + i);
                dates.push(tempDate.toISOString().split('T')[0]);
            }
            return dates;
        }

        window.loadDashboard = async function() {
            const dateStr = document.getElementById('dashboard-date').value;
            if (!dateStr) return alert("请先选择该周的任意一天！");

            const dates = getWeekDates(dateStr);
            document.getElementById('week-range').innerText = `(${dates[0]} 至 ${dates[5]})`;

            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '<tr><td colspan="8" style="padding: 20px;">数据读取与加权计算中，请稍候...</td></tr>';

            // 取得周一到周六的数据
            const dataByDate = {};
            try {
                const docRefs = dates.map(date => getDoc(doc(db, "production_data", date)));
                const snaps = await Promise.all(docRefs);
                snaps.forEach((snap, idx) => {
                    if (snap.exists()) {
                        dataByDate[dates[idx]] = snap.data();
                    } else {
                        dataByDate[dates[idx]] = {};
                    }
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="8" style="color:red;">数据读取失败，请检查网络或资料库配置。</td></tr>';
                return;
            }

            // 计算加权平均与渲染表格
            tbody.innerHTML = '';
            
            const displayOrder = [
                {id: "裁断", name: "裁断"},
                {id: "准备", name: "准备"},
                {id: "袜套", name: "袜套"},
                ...allLines.filter(l => l.group === "针车A"),
                {id: "针车A综合", name: "针车A 综合", style: "font-weight:bold; background-color:#e2e8f0;"},
                ...allLines.filter(l => l.group === "针车B"),
                {id: "针车B综合", name: "针车B 综合", style: "font-weight:bold; background-color:#e2e8f0;"},
                {id: "针车总综合", name: "针车 总综合", style: "font-weight:bold; background-color:#cbd5e0; color:#2c5282;"},
                ...allLines.filter(l => l.group === "成型"),
                {id: "成型综合", name: "成型 综合", style: "font-weight:bold; background-color:#e2e8f0;"},
                {id: "拉帮组", name: "拉帮组"},
                ...allLines.filter(l => l.group === "组底"),
                {id: "组底综合", name: "组底 综合", style: "font-weight:bold; background-color:#e2e8f0;"},
                {id: "全厂综合", name: "🏭 全厂综合 (加权)", style: "font-weight:bold; font-size:18px; background-color:#2b6cb0; color:white;"}
            ];

            displayOrder.forEach(item => {
                const tr = document.createElement('tr');
                if(item.style) tr.style = item.style;
                
                let html = `<td class="line-name">${item.name}</td>`;
                
                let weeklyTotalHours = 0;
                let weeklyWeightedPoh = 0;
                
                // 决定要计算的 ID 数组 (单一线别就只有自己，综合线别会有多个)
                const targetIds = summaryGroups[item.id] || [item.id];

                // 每日计算
                dates.forEach(date => {
                    let dailyTotalHours = 0;
                    let dailyWeightedPoh = 0;

                    targetIds.forEach(tid => {
                        const cellData = dataByDate[date][tid];
                        if (cellData && cellData.hours > 0 && !isNaN(cellData.poh)) {
                            dailyTotalHours += cellData.hours;
                            dailyWeightedPoh += cellData.poh * cellData.hours; // 权重 = 达成率 * 工时
                        }
                    });

                    if (dailyTotalHours > 0) {
                        const dailyAvg = dailyWeightedPoh / dailyTotalHours;
                        const colorClass = item.id === '全厂综合' ? '' : window.getColor(dailyAvg);
                        html += `<td class="daily-col ${colorClass}">${window.formatPercent(dailyAvg)}</td>`;
                        
                        weeklyTotalHours += dailyTotalHours;
                        weeklyWeightedPoh += dailyWeightedPoh;
                    } else {
                        html += `<td class="daily-col">-</td>`;
                    }
                });

                // 全周计算
                if (weeklyTotalHours > 0) {
                    const weeklyAvg = weeklyWeightedPoh / weeklyTotalHours;
                    const colorClass = item.id === '全厂综合' ? '' : window.getColor(weeklyAvg);
                    html += `<td class="weekly-avg ${colorClass}">${window.formatPercent(weeklyAvg)}</td>`;
                } else {
                    html += `<td class="weekly-avg">-</td>`;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }
    </script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #2d3748; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a365d; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
        .login-box button { width: 100%; padding: 12px; background: #e53e3e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight:bold;}
        .login-box button:hover { background: #c53030; }

        .dashboard { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a365d; margin-bottom: 5px; font-size: 24px;}
        
        .legend { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 14px;}
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .box { width: 20px; height: 20px; border: 1px solid #ccc; border-radius: 3px;}
        
        /* 颜色判定 */
        .color-red { background-color: #feb2b2 !important; color: #9b2c2c !important; font-weight: bold; }
        .color-light-green { background-color: #c6f6d5 !important; color: #276749 !important; font-weight: bold; }
        .color-green { background-color: #48bb78 !important; color: white !important; font-weight: bold; }

        .controls { background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .controls input { padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 15px;}
        .btn-action { padding: 8px 15px; background-color: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-action:hover { background-color: #2b6cb0; }
        .btn-toggle { background-color: #718096; }
        .btn-toggle:hover { background-color: #4a5568; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;}
        th, td { border: 1px solid #cbd5e0; padding: 10px 8px; text-align: center; }
        th { background-color: #2d3748; color: white; position: sticky; top: 0; font-size: 15px;}
        
        tbody tr:hover { background-color: #f7fafc; }
        .line-name { font-weight: 500; text-align: left; padding-left: 20px; }
        .weekly-avg { font-weight: bold; border-left: 3px solid #2d3748; font-size: 15px;}
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="border:none; margin-bottom:10px; color:#1a365d;">系统登录</h2>
            <p style="color:#718096; font-size:14px; margin-bottom:20px;">高管综合看板端</p>
            <input type="password" id="pwd-input" placeholder="请输入管理密码">
            <button onclick="checkPassword()">进入看板</button>
        </div>
    </div>

    <div class="dashboard">
        <h2>📈 综合生产看板 <span id="week-range" style="font-size:18px; color:#718096; font-weight:normal;"></span></h2>
        
        <div class="legend">
            <div class="legend-item"><div class="box color-red"></div> &lt; 80%</div>
            <div class="legend-item"><div class="box" style="background:#fff"></div> 80% ~ &lt; 90%</div>
            <div class="legend-item"><div class="box color-light-green"></div> 90% ~ &lt; 100%</div>
            <div class="legend-item"><div class="box color-green"></div> &ge; 100%</div>
        </div>

        <div class="controls">
            <div>
                <span style="font-weight:bold; margin-right:10px;">选择该周任意一天：</span>
                <input type="date" id="dashboard-date">
                <button class="btn-action" onclick="loadDashboard()">🔍 查询整周加权数据</button>
            </div>
            <button id="toggle-btn" class="btn-action btn-toggle" onclick="toggleDetails()">👁️ 隐藏每日明细</button>
        </div>
        
        <table id="dashboard-table">
            <thead>
                <tr>
                    <th width="20%">部门 / 综合组别</th>
                    <th class="daily-col" width="11%">周一</th>
                    <th class="daily-col" width="11%">周二</th>
                    <th class="daily-col" width="11%">周三</th>
                    <th class="daily-col" width="11%">周四</th>
                    <th class="daily-col" width="11%">周五</th>
                    <th class="daily-col" width="11%">周六</th>
                    <th class="weekly-avg" width="14%">整周综合(加权)</th>
                </tr>
            </thead>
            <tbody id="dashboard-table-body">
                <tr><td colspan="8" style="padding: 20px; color:#a0aec0;">请选择日期并点击查询。</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
