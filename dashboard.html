<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局生产线快照看板 (纯 RTDB 版)</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
          authDomain: "lfy-dashboard.firebaseapp.com",
          databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lfy-dashboard",
          storageBucket: "lfy-dashboard.firebasestorage.app",
          messagingSenderId: "765435998608",
          appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app); 
        const ACCESS_PASSWORD = "888888"; 
        
        let rowDefinitions = []; 
        window.currentFactory = localStorage.getItem('selected_factory') || 'lfy';
        window.weeksData = []; // 紀錄所有週的資訊供動態折疊使用

        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth_dash', 'true');
                document.getElementById('factory-select').value = window.currentFactory;
                initDashboardConfig(); 
            } else {
                alert("密码错误！");
            }
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth_dash') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('factory-select').value = window.currentFactory;
                initDashboardConfig(); 
            }
            document.getElementById('pwd-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.checkPassword();
            });
        };

        window.switchFactory = function() {
            window.currentFactory = document.getElementById('factory-select').value;
            localStorage.setItem('selected_factory', window.currentFactory);
            document.getElementById('table-body').innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px;">切换厂区中，数据加载中...</td></tr>';
            initDashboardConfig();
        }

        async function initDashboardConfig() {
            const factoryName = window.currentFactory === 'lfy' ? 'LFY 厂' : 'LY 厂';
            document.getElementById('board-title').innerHTML = `🌐 全局快照多周看板 - <span style="color:#facc15;">${factoryName}</span>`;

            try {
                const layoutDocId = window.currentFactory === 'lfy' ? "layout" : "ly_layout";
                const snapshot = await get(ref(db, 'system_config/' + layoutDocId));
                
                if (snapshot.exists()) {
                    const config = snapshot.val();
                    rowDefinitions = [];

                    config.groups.forEach(group => {
                        group.lines.forEach(line => {
                            rowDefinitions.push({ type: 'line', name: line.name, id: line.id, groupName: group.name, inFactory: group.isFactoryTotal });
                        });
                    });

                    rowDefinitions.push({ type: 'spacer' });

                    let stitchGroupsCount = 0;
                    let lastStitchIndex = -1;

                    config.groups.forEach(group => {
                        rowDefinitions.push({ type: 'summary', name: `${group.name}小计`, calc: 'group', groupName: group.name, isBottomSummary: !group.isFactoryTotal });
                        if (group.name.includes('针车')) {
                            stitchGroupsCount++;
                            lastStitchIndex = rowDefinitions.length - 1;
                        }
                    });

                    if (stitchGroupsCount > 0) {
                        rowDefinitions.splice(lastStitchIndex + 1, 0, { type: 'summary', name: '针车总综合', calc: 'stitchTotal', isBottomSummary: false });
                    }

                    rowDefinitions.push({ type: 'summary', name: '全厂综合%', calc: 'factory', isFactoryTotal: true });
                    setDefaultDatesAndLoad();
                } else {
                    document.getElementById('table-body').innerHTML = `<tr><td colspan="10" style="text-align: center; color: #ff4d4f; padding: 40px; font-weight:bold;">⚠️ 尚未建立 ${factoryName} 的产线架构！请先前往设定中心建立。</td></tr>`;
                }
            } catch (e) { console.error(e); }
        }

        function setDefaultDatesAndLoad() {
            let today = new Date();
            let eightWeeksAgo = new Date();
            eightWeeksAgo.setDate(today.getDate() - 56);
            
            document.getElementById('end-date').value = today.toISOString().split('T')[0];
            document.getElementById('start-date').value = eightWeeksAgo.toISOString().split('T')[0];
            
            window.loadDashboard();
        }

        function getColorClass(val) {
            if (val === null || val === undefined || isNaN(val)) return 'val-normal';
            if (val < 0.8) return 'val-red';          
            if (val >= 0.8 && val < 0.9) return 'val-normal'; 
            if (val >= 0.9 && val < 1.0) return 'val-light-green'; 
            if (val >= 1.0) return 'val-green';       
            return 'val-normal';                      
        }

        function getRowValueAndHours(rowDef, dayData) {
            if (rowDef.type === 'line') {
                if (dayData[rowDef.id]) return { poh: dayData[rowDef.id].poh, hours: dayData[rowDef.id].hours };
                return { poh: NaN, hours: 0 };
            }
            if (rowDef.calc === 'group') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.type === 'line' && rd.groupName === rowDef.groupName && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours; h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }
            if (rowDef.calc === 'stitchTotal') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.type === 'line' && rd.groupName && rd.groupName.includes('针车') && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours; h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }
            if (rowDef.calc === 'factory') {
                let p = 0, h = 0;
                rowDefinitions.forEach(rd => {
                    if (rd.type === 'line' && rd.inFactory && dayData[rd.id]) {
                        p += dayData[rd.id].poh * dayData[rd.id].hours; h += dayData[rd.id].hours;
                    }
                });
                return { poh: h > 0 ? p / h : NaN, hours: h };
            }
            return { poh: NaN, hours: 0 };
        }

        window.loadDashboard = async function() {
            const startDateStr = document.getElementById('start-date').value;
            const endDateStr = document.getElementById('end-date').value;
            if (!startDateStr || !endDateStr) return;

            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            if (start > end) return alert("开始日期不能大于结束日期！");

            const btn = document.getElementById('search-btn');
            btn.innerText = "计算中...";
            
            try {
                const collectionName = window.currentFactory === 'lfy' ? "production_data" : "ly_production_data";
                const snapshot = await get(ref(db, collectionName));
                const dbData = snapshot.exists() ? snapshot.val() : {};

                let weeks = [];
                let curr = new Date(start);
                let day = curr.getDay();
                let diff = curr.getDate() - day + (day === 0 ? -6 : 1);
                curr.setDate(diff);

                while (curr <= end) {
                    let weekDays = [];
                    let weekStartStr = '', weekEndStr = '';
                    for (let i = 0; i < 6; i++) {
                        let d = new Date(curr);
                        d.setDate(curr.getDate() + i);
                        let yyyy = d.getFullYear();
                        let mm = String(d.getMonth() + 1).padStart(2, '0');
                        let dd = String(d.getDate()).padStart(2, '0');
                        let dateStr = `${yyyy}-${mm}-${dd}`;
                        if (i === 0) weekStartStr = `${mm}/${dd}`;
                        if (i === 5) weekEndStr = `${mm}/${dd}`;
                        weekDays.push(dateStr);
                    }
                    weeks.push({ title: `${weekStartStr}-${weekEndStr}`, days: weekDays });
                    curr.setDate(curr.getDate() + 7);
                }

                if (weeks.length === 0) return alert("所选范围内没有找到周数据！");
                window.weeksData = weeks; 

                const theadTr1 = document.getElementById('thead-tr-1');
                const theadTr2 = document.getElementById('thead-tr-2');
                theadTr1.innerHTML = '<th rowspan="2" class="sticky-col">线别 / 部门</th>';
                theadTr2.innerHTML = '';

                // ★ 渲染動態可點擊的週標題
                weeks.forEach((week, wIndex) => {
                    theadTr1.innerHTML += `<th colspan="7" class="week-group-header" id="week-header-${wIndex}" onclick="toggleWeek(${wIndex})" title="点击折叠/展开该周">🔽 ${week.title}</th>`;
                    ['周一', '周二', '周三', '周四', '周五', '周六'].forEach(dName => {
                        theadTr2.innerHTML += `<th class="daily-col week-col-${wIndex}">${dName}</th>`;
                    });
                    theadTr2.innerHTML += `<th class="weekly-avg-header">整周综合</th>`;
                });

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                rowDefinitions.forEach(rowDef => {
                    const tr = document.createElement('tr');
                    
                    if (rowDef.type === 'spacer') {
                        tr.innerHTML = `<td colspan="${1 + weeks.length * 7}" style="height: 30px; background-color: transparent; border: none;"></td>`;
                        tbody.appendChild(tr);
                        return;
                    }

                    if (rowDef.type === 'summary') {
                        tr.className = 'summary-row';
                        if (rowDef.isFactoryTotal) tr.classList.add('factory-total-row');
                        if (rowDef.isBottomSummary) tr.classList.add('bottom-summary-row');
                    } else {
                        tr.className = 'data-row';
                    }

                    let html = `<td class="line-name sticky-col">${rowDef.name}</td>`;

                    weeks.forEach((week, wIndex) => {
                        let weekTotalProd = 0;
                        let weekTotalHours = 0;

                        week.days.forEach(dateStr => {
                            let dayData = dbData[dateStr] || {};
                            let valObj = getRowValueAndHours(rowDef, dayData);
                            if (valObj.hours > 0) {
                                html += `<td class="daily-col week-col-${wIndex} ${getColorClass(valObj.poh)}">${(valObj.poh * 100).toFixed(1)}%</td>`;
                                weekTotalProd += valObj.poh * valObj.hours;
                                weekTotalHours += valObj.hours;
                            } else {
                                html += `<td class="daily-col week-col-${wIndex} val-normal">-</td>`;
                            }
                        });

                        let weekAvgPoh = weekTotalHours > 0 ? (weekTotalProd / weekTotalHours) : NaN;
                        let avgStr = !isNaN(weekAvgPoh) ? `${(weekAvgPoh * 100).toFixed(1)}%` : '-';
                        html += `<td class="weekly-avg ${getColorClass(weekAvgPoh)}">${avgStr}</td>`;
                    });

                    tr.innerHTML = html;
                    tbody.appendChild(tr);
                });
            } finally {
                btn.innerText = "查询计算";
            }
        }

        // ★ 單週折疊/展開邏輯
        window.toggleWeek = function(wIndex) {
            const cols = document.querySelectorAll(`.week-col-${wIndex}`);
            const header = document.getElementById(`week-header-${wIndex}`);
            if (!cols || cols.length === 0) return;
            
            const isHidden = cols[0].style.display === 'none';
            cols.forEach(col => { col.style.display = isHidden ? 'table-cell' : 'none'; });
            
            header.colSpan = isHidden ? 7 : 1;
            const titleText = header.innerText.replace('🔽 ', '').replace('▶️ ', '');
            header.innerText = isHidden ? `🔽 ${titleText}` : `▶️ ${titleText}`;
        }

        // ★ 全局折疊/展開邏輯
        window.toggleAllDetails = function() {
            if(!window.weeksData || window.weeksData.length === 0) return;
            
            const firstCol = document.querySelector('.daily-col');
            const isHidden = firstCol && firstCol.style.display === 'none';
            
            for(let i=0; i<window.weeksData.length; i++) {
                const cols = document.querySelectorAll(`.week-col-${i}`);
                const header = document.getElementById(`week-header-${i}`);
                if(cols.length > 0) {
                    cols.forEach(col => { col.style.display = isHidden ? 'table-cell' : 'none'; });
                    header.colSpan = isHidden ? 7 : 1;
                    const titleText = header.innerText.replace('🔽 ', '').replace('▶️ ', '');
                    header.innerText = isHidden ? `🔽 ${titleText}` : `▶️ ${titleText}`;
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; margin: 0; padding: 5px; color: #94a3b8; font-size: 12px; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 280px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.1); }
        .login-box input { width: 90%; padding: 10px; margin-bottom: 15px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 6px; outline: none; }
        .login-box input:focus { border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.4); }
        .login-box button { width: 100%; padding: 10px; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight:bold; letter-spacing: 1px;}
        
        .dashboard { max-width: 98vw; margin: auto; background: #111827; padding: 10px 15px; border-radius: 8px; border: 1px solid #1f2937; box-shadow: 0 5px 20px rgba(0,0,0,0.8); overflow-x: auto; }
        .header-bar { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        h2 { color: #00e5ff; margin: 0; text-align: left; font-size: 18px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); display: flex; align-items: center; gap: 8px; }
        h2::before { content: '🌐'; font-size: 20px; }
        
        .factory-select { background: #1e293b; color: #facc15; border: 1px solid #facc15; padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; outline: none; box-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }
        .factory-select option { background: #0f172a; color: #fff; }

        .controls { background: #1e293b; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; display: flex; justify-content: flex-start; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .controls span { color: #e2e8f0; font-weight: bold; }
        .controls input { background: #0f172a; color: #00e5ff; padding: 4px 6px; border: 1px solid #334155; border-radius: 4px; outline: none; font-size: 12px; }
        .controls input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .btn-cyan { background: #0891b2; color: white; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-cyan:hover { background: #0ea5e9; box-shadow: 0 0 8px rgba(14, 165, 233, 0.5); }
        .btn-dark { background: #334155; color: white; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-dark:hover { background: #475569; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 5px; white-space: nowrap; }
        th, td { border: 1px solid #1f2937; padding: 4px 6px; text-align: center; }
        th { background-color: #0f172a; color: #94a3b8; font-weight: 600; }
        
        /* 標題游標變成手指，提示可點擊 */
        .week-group-header { background-color: #1e293b !important; color: #00e5ff; letter-spacing: 1px; border-bottom: 1px solid #00e5ff; cursor: pointer; user-select: none; transition: 0.2s;}
        .week-group-header:hover { background-color: #334155 !important; color: #fff;}

        .weekly-avg-header { background-color: #162032 !important; color: #00e5ff; border-left: 2px solid #00e5ff !important; border-right: 2px solid #00e5ff !important; font-weight: bold; }
        .weekly-avg { background-color: #162032 !important; border-left: 2px solid #00e5ff !important; border-right: 2px solid #00e5ff !important; font-size: 1.05em; font-weight: bold; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.05); }

        .data-row td { background-color: #111827; }
        .data-row:hover td { background-color: #1f2937; }
        
        .summary-row td { background-color: #1e293b; color: #94a3b8; font-weight: bold; border-top: 2px solid #334155; border-bottom: 2px solid #334155; font-size: 1.05em; }
        .factory-total-row td { background-color: #0f172a; color: #94a3b8; font-size: 1.1em; border-top: 3px double #00e5ff; }
        .line-name { text-align: left; padding-left: 10px; color: #e2e8f0 !important; font-weight: bold; border-right: 2px solid #334155; min-width: 100px; text-shadow: none !important; }

        td.val-red { color: #ff4d4f !important; font-weight: 800; text-shadow: 0 0 6px rgba(255, 77, 79, 0.4); }
        td.val-normal { color: #94a3b8 !important; font-weight: 500; text-shadow: none; } 
        td.val-light-green { color: #4ade80 !important; font-weight: 700; text-shadow: none; } 
        td.val-green { color: #00ff66 !important; font-weight: 900; text-shadow: 0 0 12px rgba(0, 255, 102, 0.8), 0 0 4px rgba(0, 255, 102, 0.5); font-size: 1.08em; letter-spacing: 0.5px;}

        .sticky-col { position: sticky; left: 0; background-color: #0f172a !important; z-index: 2; box-shadow: 2px 0 4px rgba(0,0,0,0.5); }
        .summary-row .sticky-col { background-color: #1e293b !important; }
        .factory-total-row .sticky-col { background-color: #0f172a !important; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="justify-content: center; margin-bottom:15px; font-size: 18px;">系统登录</h2>
            <input type="password" id="pwd-input" placeholder="请输入管理密码 (支持Enter)">
            <button onclick="checkPassword()">进入全厂看板</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="header-bar">
            <h2 id="board-title">🌐 全局快照多周看板</h2>
            <select id="factory-select" class="factory-select" onchange="switchFactory()">
                <option value="lfy">切换: LFY 厂</option>
                <option value="ly">切换: LY 厂</option>
            </select>
        </div>
        <div class="controls">
            <span>数据时间范围：</span>
            <input type="date" id="start-date"> <span>至</span> <input type="date" id="end-date">
            <button id="search-btn" class="btn-cyan" onclick="loadDashboard()">查询计算</button>
            <!-- ★ 改用 toggleAllDetails 控制全局 -->
            <button class="btn-dark" onclick="toggleAllDetails()">一键隐藏 / 展开每日明细</button>
        </div>
        <div style="overflow-x: auto;">
            <table id="dashboard-table">
                <thead>
                    <tr id="thead-tr-1"><th rowspan="2" class="sticky-col">线别 / 部门</th></tr>
                    <tr id="thead-tr-2"></tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="10" style="text-align: center; color: #475569; padding: 40px; font-size: 14px;">数据加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
