<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产线数据录入终端 (动态架构版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
          authDomain: "lfy-dashboard.firebaseapp.com",
          databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lfy-dashboard",
          storageBucket: "lfy-dashboard.firebasestorage.app",
          messagingSenderId: "765435998608",
          appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ACCESS_PASSWORD = "888888"; 
        
        // 存放從資料庫動態讀取的線別資訊
        window.lines = []; 

        window.checkPassword = function() {
            const pwd = document.getElementById('pwd-input').value;
            if (pwd === ACCESS_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                sessionStorage.setItem('lfy_auth', 'true');
                initSystem(); // 登入成功後初始化系統
            } else {
                alert("密码错误，请重试！");
            }
        };

        window.onload = () => {
            if (sessionStorage.getItem('lfy_auth') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                initSystem(); // 已登入則直接初始化
            }
            document.getElementById('pwd-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.checkPassword();
            });
        };

        // 讀取架構並生成表格
        async function initSystem() {
            try {
                const docSnap = await getDoc(doc(db, "system_config", "layout"));
                if (docSnap.exists()) {
                    const config = docSnap.data();
                    window.lines = [];
                    
                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = ''; // 清空原本內容

                    config.groups.forEach(group => {
                        // 插入群組標題
                        const groupRow = document.createElement('tr');
                        groupRow.className = "group-header";
                        groupRow.innerHTML = `<td colspan="3">${group.name}</td>`;
                        tbody.appendChild(groupRow);

                        // 插入該群組的線別
                        group.lines.forEach(line => {
                            window.lines.push({ id: line.id, name: line.name, group: group.name });
                            const tr = document.createElement('tr');
                            tr.className = "data-row";
                            tr.innerHTML = `
                                <td class="line-name">${line.name}</td>
                                <td><input type="number" step="0.01" id="${line.id}_poh" class="input-box" placeholder="例如: 95.5"></td>
                                <td><input type="number" step="0.5" id="${line.id}_hours" class="input-box" placeholder="例如: 640"></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    });
                    
                    bindEvents();
                } else {
                    alert("⚠️ 尚未建立产线架构！请先前往 config.html 设定并保存架构。");
                }
            } catch (e) {
                console.error(e);
                alert("读取架构设定失败！");
            }
        }

        function bindEvents() {
            document.getElementById('date-picker').addEventListener('change', function(e) {
                const date = new Date(this.value);
                if (date.getDay() === 0) {
                    alert("⚠️ 星期日为假日，系统已锁定，不可输入数据！");
                    this.value = '';
                    document.querySelectorAll('.input-box').forEach(el => el.value = '');
                } else {
                    loadData(this.value);
                }
            });

            document.addEventListener('paste', function(e) {
                if (e.target.tagName !== 'INPUT' || !e.target.classList.contains('input-box')) return;
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const rows = pasteData.trim().split('\n');
                
                const activeInput = document.activeElement;
                const startTr = activeInput.closest('tr');
                const tbody = startTr.parentElement;
                const allDataRows = Array.from(tbody.querySelectorAll('tr.data-row'));
                const startIndex = allDataRows.indexOf(startTr);
                const isPoh = activeInput.id.includes('_poh');
                
                for (let i = 0; i < rows.length; i++) {
                    if (startIndex + i >= allDataRows.length) break;
                    const cols = rows[i].split('\t');
                    const targetTr = allDataRows[startIndex + i];
                    
                    const pohInput = targetTr.querySelector('input[id$="_poh"]');
                    const hoursInput = targetTr.querySelector('input[id$="_hours"]');
                    
                    if (isPoh) {
                        if (cols[0]) pohInput.value = parseFloat(cols[0].replace('%', '').trim());
                        if (cols.length >= 2 && cols[1]) hoursInput.value = parseFloat(cols[1].trim());
                    } else {
                        if (cols[0]) hoursInput.value = parseFloat(cols[0].trim());
                    }
                }
            });
        }

        async function loadData(dateStr) {
            try {
                const docSnap = await getDoc(doc(db, "production_data", dateStr));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.lines.forEach(line => {
                        const pohEl = document.getElementById(`${line.id}_poh`);
                        const hoursEl = document.getElementById(`${line.id}_hours`);
                        if (pohEl && hoursEl) {
                            if (data[line.id]) {
                                pohEl.value = (data[line.id].poh * 100).toFixed(2);
                                hoursEl.value = data[line.id].hours;
                            } else {
                                pohEl.value = '';
                                hoursEl.value = '';
                            }
                        }
                    });
                } else {
                    document.querySelectorAll('.input-box').forEach(el => el.value = '');
                }
            } catch(e) { console.error(e); }
        }

        window.saveData = async function() {
            const dateStr = document.getElementById('date-picker').value;
            if (!dateStr) return alert("请先选择数据日期！");

            const data = {};
            window.lines.forEach(line => {
                const pohEl = document.getElementById(`${line.id}_poh`);
                const hoursEl = document.getElementById(`${line.id}_hours`);
                if(pohEl && hoursEl) {
                    const poh = pohEl.value;
                    const hours = hoursEl.value;
                    if (poh !== '' && hours !== '') {
                        data[line.id] = { poh: parseFloat(poh) / 100, hours: parseFloat(hours) };
                    }
                }
            });

            const btn = document.getElementById('save-btn');
            try {
                btn.innerText = "数据上传中...";
                btn.disabled = true;
                await setDoc(doc(db, "production_data", dateStr), data, { merge: true });
                alert("✅ 数据同步至云端成功！");
            } catch (e) { alert("❌ 保存失败：" + e.message); } 
            finally {
                btn.innerText = "🚀 一键同步至云端";
                btn.disabled = false;
            }
        }

        window.handleExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!confirm("此操作将解析 Excel 历史数据并补充至云端，确定执行？")) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    document.getElementById('upload-btn-label').innerText = "解析运算中...";
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    
                    const sheetPoh = workbook.Sheets["POH输入"];
                    const sheetHours = workbook.Sheets["工时输入"];
                    if (!sheetPoh || !sheetHours) throw new Error("缺少 'POH输入' 或 '工时输入' 工作表。");

                    const jsonPoh = XLSX.utils.sheet_to_json(sheetPoh, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});
                    const jsonHours = XLSX.utils.sheet_to_json(sheetHours, {header: 1});
                    
                    const dates = jsonPoh[0];
                    const firebaseData = {};
                    
                    for(let i = 1; i < jsonPoh.length; i++) {
                        const lineName = jsonPoh[i][0];
                        if(!lineName) continue;
                        
                        const lineObj = window.lines.find(l => l.name === lineName);
                        const lineId = lineObj ? lineObj.id : lineName; // 使用動態 ID 對應
                        
                        for(let j = 1; j < dates.length; j++) {
                            let dateRaw = dates[j];
                            let poh = parseFloat(jsonPoh[i][j]);
                            let hours = parseFloat(jsonHours[i][j]);
                            
                            if (!isNaN(poh) && poh > 2) poh = poh / 100;

                            if(!isNaN(poh) && !isNaN(hours) && dateRaw) {
                                let finalDate = "";
                                if (dateRaw instanceof Date) {
                                    let d = new Date(dateRaw.getTime() - dateRaw.getTimezoneOffset() * 60000);
                                    finalDate = d.toISOString().split('T')[0];
                                } else {
                                    let parsedStr = String(dateRaw).split(' ')[0].replace(/\//g, '-');
                                    let parts = parsedStr.split('-');
                                    if(parts.length === 3) {
                                        let month = parts[1].padStart(2, '0');
                                        let day = parts[2].replace(/日/g, '').replace(/号/g, '').padStart(2, '0');
                                        let year = parts[0].includes('月') ? new Date().getFullYear() : parts[0];
                                        finalDate = `${year}-${month}-${day}`;
                                    } else {
                                        finalDate = parsedStr;
                                    }
                                }
                                
                                if(!firebaseData[finalDate]) firebaseData[finalDate] = {};
                                firebaseData[finalDate][lineId] = { poh, hours };
                            }
                        }
                    }
                    
                    let count = Object.keys(firebaseData).length;
                    if (count === 0) throw new Error("未解析出有效数据。");

                    for(const [date, payload] of Object.entries(firebaseData)) {
                        await setDoc(doc(db, "production_data", date), payload, { merge: true });
                    }
                    alert(`✅ 数据清洗完毕，成功导入 ${count} 天记录！`);
                } catch (err) {
                    alert("❌ 导入异常: " + err.message);
                } finally {
                    document.getElementById('upload-btn-label').innerHTML = `<svg style="width:16px; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg> 批量导入历史 Excel`;
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; margin: 0; padding: 20px; color: #94a3b8; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #161b22; padding: 40px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 300px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.1); }
        .login-box input { width: 90%; padding: 12px; margin-bottom: 20px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 6px; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight:bold; letter-spacing: 2px;}
        .container { max-width: 800px; margin: auto; background: #111827; padding: 30px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 25px; }
        h2 { color: #00e5ff; margin: 0; font-size: 22px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); display: flex; align-items: center; gap: 10px; }
        h2::before { content: '🎛️'; font-size: 24px; }
        .upload-btn { background: #1e293b; color: #00e5ff; border: 1px solid #00e5ff; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; display: flex; align-items: center;}
        .upload-btn:hover { background: #00e5ff; color: #0b0f19; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        input[type="file"] { display: none; }
        .date-section { text-align: center; margin-bottom: 20px; font-size: 16px; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #334155;}
        .date-section label { color: #e2e8f0; font-weight: bold; margin-right: 10px; }
        .date-section input { padding: 8px 15px; background: #0f172a; color: #00e5ff; font-size: 16px; border: 1px solid #334155; border-radius: 4px; outline: none; }
        .date-section input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; text-align: center; border: 1px solid #1f2937; }
        th { background-color: #0f172a; color: #94a3b8; font-weight: 600; }
        .group-header { background-color: #1e293b; color: #00e5ff; font-weight: bold; text-align: left; padding-left: 20px; letter-spacing: 1px; }
        tr.data-row { background-color: #111827; }
        tr.data-row:nth-child(even) { background-color: #161b22; }
        tr.data-row:hover { background-color: #1f2937; }
        .line-name { font-weight: bold; color: #e2e8f0; }
        .input-box { width: 85%; padding: 8px; background: #0b0f19; color: #00e676; border: 1px solid #334155; border-radius: 4px; text-align: center; font-size: 14px; font-weight: bold;}
        .input-box:focus { border-color: #00e5ff; outline: none; box-shadow: 0 0 8px rgba(0, 229, 255, 0.4); }
        .save-btn { display: block; width: 100%; padding: 15px; background: linear-gradient(90deg, #059669 0%, #10b981 100%); color: white; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; letter-spacing: 2px; }
        .save-btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .save-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 style="justify-content: center; margin-bottom:20px; font-size: 20px;">系统登录</h2>
            <input type="password" id="pwd-input" placeholder="请输入管理密码 (支持Enter)">
            <button onclick="checkPassword()">进入录入终端</button>
        </div>
    </div>
    <div class="container">
        <div class="header-bar">
            <h2>终端节点 录入中心</h2>
            <label class="upload-btn" id="upload-btn-label">
                <svg style="width:16px; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                批量导入历史 Excel
                <input type="file" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
            </label>
        </div>
        <div class="date-section">
            <label for="date-picker">设定数据归属日期：</label>
            <input type="date" id="date-picker">
        </div>
        <table>
            <thead>
                <tr>
                    <th width="30%">产线标识</th>
                    <th width="35%">POH达标率 (%)</th>
                    <th width="35%">总工时 (H)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="3" style="text-align:center; padding:30px;">正在动态加载产线架构...</td></tr>
            </tbody>
        </table>
        <button id="save-btn" class="save-btn" onclick="saveData()">🚀 一键同步至云端</button>
    </div>
</body>
</html>
