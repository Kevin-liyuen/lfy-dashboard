<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFY 生產線數據輸入</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMckSKafxLho2CR5PVe8KLJ6dYAEIJiZI",
            authDomain: "lfy-dashboard.firebaseapp.com",
            databaseURL: "https://lfy-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lfy-dashboard",
            storageBucket: "lfy-dashboard.firebasestorage.app",
            messagingSenderId: "765435998608",
            appId: "1:765435998608:web:220c0534494262c4924315"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const allLines = [
            { id: "cut", name: "裁断", group: "裁断" },
            { id: "prep", name: "准备", group: "准备" },
            { id: "sock", name: "袜套", group: "袜套" },
            ...Array.from({length: 10}, (_, i) => ({ id: `stitchA${i+1}`, name: `针车A${i+1}`, group: "针车A" })),
            { id: "stitchA_sample", name: "针车A-销样组", group: "针车A" },
            ...Array.from({length: 14}, (_, i) => ({ id: `stitchB${i+11}`, name: `针车B${i+11}`, group: "针车B" })),
            ...['A','B','C','D','E','F'].map(c => ({ id: `mold${c}`, name: `成型${c}`, group: "成型" })),
            { id: "pull", name: "拉帮组", group: "拉帮组" },
            ...Array.from({length: 5}, (_, i) => ({ id: `bottom${i+1}`, name: `组底${i+1}`, group: "组底" }))
        ];

        // 建立輸入表格陣列以便處理貼上事件
        let inputGrid = [];

        window.onload = async () => {
            initInputTable();
            
            document.getElementById('save-status').innerText = "連線中...";
            try {
                // 匿名登入以獲取 Firestore 寫入權限
                await signInAnonymously(auth);
                document.getElementById('save-status').innerText = "✅ 系統已連線，準備就緒。";
            } catch (error) {
                console.error("登入失敗:", error);
                document.getElementById('save-status').innerText = "⚠️ 權限錯誤：請確認 Firebase 規則已設為測試模式。";
            }

            // 預設今天日期
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('input-date').value = today;
            
            if(new Date().getDay() !== 0) {
                document.getElementById('input-date').dispatchEvent(new Event('change'));
            }
        };

        window.initInputTable = function() {
            const tbody = document.getElementById('input-table-body');
            tbody.innerHTML = '';
            let currentGroup = '';
            inputGrid = [];
            
            allLines.forEach((line, index) => {
                if(line.group !== currentGroup) {
                    currentGroup = line.group;
                    const groupRow = document.createElement('tr');
                    groupRow.innerHTML = `<td colspan="3" class="group-header">${currentGroup}</td>`;
                    tbody.appendChild(groupRow);
                }
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'even-row' : 'odd-row';
                
                // 建立輸入框並加入陣列
                const pohInput = document.createElement('input');
                pohInput.type = 'number';
                pohInput.step = '0.01';
                pohInput.id = `input_${line.id}_poh`;
                pohInput.className = 'input-box';
                pohInput.placeholder = '達成率(%)';

                const hoursInput = document.createElement('input');
                hoursInput.type = 'number';
                hoursInput.step = '0.01';
                hoursInput.id = `input_${line.id}_hours`;
                hoursInput.className = 'input-box';
                hoursInput.placeholder = '工时';

                // 儲存到 grid 供 paste 使用 [row][col]
                inputGrid.push([pohInput, hoursInput]);

                const tdName = document.createElement('td');
                tdName.className = 'line-name';
                tdName.innerText = line.name;
                
                const tdPoh = document.createElement('td');
                tdPoh.appendChild(pohInput);
                
                const tdHours = document.createElement('td');
                tdHours.appendChild(hoursInput);

                tr.appendChild(tdName);
                tr.appendChild(tdPoh);
                tr.appendChild(tdHours);
                tbody.appendChild(tr);

                // 綁定貼上事件
                [pohInput, hoursInput].forEach((input, colIdx) => {
                    input.addEventListener('paste', (e) => handlePaste(e, index, colIdx));
                });
            });
        };

        function handlePaste(e, startRow, startCol) {
            e.preventDefault();
            const pasteData = (e.clipboardData || window.clipboardData).getData('text');
            if (!pasteData) return;

            // 依據換行符號切割列
            const rows = pasteData.split(/\r\n|\n|\r/);
            
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].trim() === '') continue; // 略過空列
                // 依據 Tab 鍵切割欄
                const cells = rows[i].split('\t');
                
                for (let j = 0; j < cells.length; j++) {
                    const targetRow = startRow + i;
                    const targetCol = startCol + j;
                    
                    // 確保沒有超出輸入框範圍
                    if (targetRow < inputGrid.length && targetCol < 2) {
                        const cellValue = cells[j].trim().replace(/,/g, ''); // 移除可能的千分位逗號
                        if (cellValue !== '' && !isNaN(cellValue)) {
                            inputGrid[targetRow][targetCol].value = cellValue;
                        }
                    }
                }
            }
        }

        document.getElementById('input-date').addEventListener('change', async function(e) {
            const date = new Date(this.value);
            if (date.getDay() === 0) {
                alert("🔴 週日為假日，系統鎖定不可輸入！");
                this.value = '';
                document.querySelectorAll('.input-box').forEach(el => el.value = '');
                return;
            }
            
            document.getElementById('save-status').innerText = "讀取中...";
            try {
                const docRef = doc(db, "production_data", this.value);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    allLines.forEach(line => {
                        if (data[line.id]) {
                            document.getElementById(`input_${line.id}_poh`).value = (data[line.id].poh * 100).toFixed(2);
                            document.getElementById(`input_${line.id}_hours`).value = data[line.id].hours;
                        } else {
                            document.getElementById(`input_${line.id}_poh`).value = '';
                            document.getElementById(`input_${line.id}_hours`).value = '';
                        }
                    });
                    document.getElementById('save-status').innerText = "已載入歷史資料。您可以直接貼上 Excel 覆蓋。";
                } else {
                    document.querySelectorAll('.input-box').forEach(el => el.value = '');
                    document.getElementById('save-status').innerText = "無歷史資料，請開始輸入。支援從 Excel 圈選後直接貼上。";
                }
            } catch (error) {
                console.error("Firebase 連線錯誤:", error);
                document.getElementById('save-status').innerText = "⚠️ 讀取失敗，請重新整理頁面。";
            }
        });

        window.saveData = async function() {
            if (!auth.currentUser) return alert("系統尚未連線，請稍後再試。");
            
            const dateStr = document.getElementById('input-date').value;
            if (!dateStr) return alert("請先選擇日期！");

            const btn = document.querySelector('.save-btn');
            btn.innerText = "儲存中...";
            btn.disabled = true;

            const data = {};
            allLines.forEach(line => {
                const poh = document.getElementById(`input_${line.id}_poh`).value;
                const hours = document.getElementById(`input_${line.id}_hours`).value;
                if (poh !== '' && hours !== '') {
                    data[line.id] = {
                        poh: parseFloat(poh) / 100, // 存入小數 (80% -> 0.8)
                        hours: parseFloat(hours)
                    };
                }
            });

            try {
                await setDoc(doc(db, "production_data", dateStr), data);
                document.getElementById('save-status').innerText = "✅ 儲存成功！時間：" + new Date().toLocaleTimeString();
                alert("數據保存成功！");
            } catch (e) {
                console.error(e);
                alert("保存失敗，請檢查網路：" + e.message);
                document.getElementById('save-status').innerText = "⚠️ 儲存失敗。";
            } finally {
                btn.innerText = "一鍵保存提交";
                btn.disabled = false;
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .controls { text-align: center; margin-bottom: 20px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
        .controls input[type="date"] { padding: 10px; font-size: 16px; border: 1px solid #bdc3c7; border-radius: 4px; margin: 0 10px; font-family: inherit;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: center; border: 1px solid #e0e0e0; }
        th { background-color: #34495e; color: white; font-size: 16px; font-weight: 500;}
        
        .group-header { background-color: #d2d7d3; font-weight: bold; text-align: left; padding-left: 20px; font-size: 18px; color: #2c3e50; }
        .even-row { background-color: #ffffff; }
        .odd-row { background-color: #f8f9fa; }
        .even-row:hover, .odd-row:hover { background-color: #e8f4f8; }
        
        .line-name { font-weight: 600; color: #2c3e50;}
        
        /* 輸入框顏色區分 */
        input[id$="_poh"] { background-color: #fdfbf7; border-color: #f39c12;}
        input[id$="_hours"] { background-color: #f4f8fb; border-color: #3498db;}
        
        .input-box { width: 85%; padding: 10px; border: 1px solid #aaa; border-radius: 4px; text-align: center; font-size: 16px; transition: 0.2s;}
        .input-box:focus { outline: 2px solid #2ecc71; background-color: #fff; }
        
        .save-btn { display: block; width: 100%; padding: 18px; margin-top: 25px; background-color: #27ae60; color: white; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);}
        .save-btn:hover { background-color: #2ecc71; transform: translateY(-2px); box-shadow: 0 6px 8px rgba(39, 174, 96, 0.4);}
        #save-status { text-align: center; margin-top: 15px; color: #e67e22; font-size: 15px; font-weight: 500;}
        .tips { margin-top: 20px; font-size: 13px; color: #95a5a6; text-align: center;}
    </style>
</head>
<body>
    <div class="container">
        <h2>📝 生產線每日數據輸入</h2>
        <div class="subtitle">支援從 Excel 圈選多個欄位直接 Ctrl+V 貼上</div>
        
        <div class="controls">
            <label style="font-weight: bold; color: #2c3e50;">選擇輸入日期：</label>
            <input type="date" id="input-date">
        </div>
        
        <table>
            <thead>
                <tr>
                    <th width="20%">線別</th>
                    <th width="40%">POH達標率 (%)</th>
                    <th width="40%">實際工時</th>
                </tr>
            </thead>
            <tbody id="input-table-body">
                <!-- Javascript 動態生成輸入框 -->
            </tbody>
        </table>
        
        <button class="save-btn" onclick="saveData()">一鍵保存提交</button>
        <div id="save-status">準備連線...</div>
        
        <div class="tips">
            💡 提示：在 Excel 中圈選對應的「達標率」與「工時」兩欄（不含標題），點擊網頁的第一個輸入框，按下 Ctrl+V 即可自動填滿。
        </div>
    </div>
</body>
</html>
